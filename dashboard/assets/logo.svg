<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
  <defs>
    <linearGradient id="mStripe" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0066b1"/>
      <stop offset="50%" stop-color="#1c69d4"/>
      <stop offset="100%" stop-color="#e22718"/>
    </linearGradient>
  </defs>

  <!-- M tricolor stripe top -->
  <rect x="0" y="0" width="400" height="3" fill="url(#mStripe)" rx="0"/>

  <!-- Geometric hexagon badge -->
  <g transform="translate(8, 12)">
    <!-- Outer hexagon outline -->
    <polygon points="30,0 60,0 75,25 60,50 30,50 15,25" fill="none" stroke="#3c3c3c" stroke-width="1.5"/>
    <!-- Inner hexagon with M gradient -->
    <polygon points="30,6 57,6 69,25 57,44 30,44 18,25" fill="#1a1a1a" stroke="#1c69d4" stroke-width="1"/>
    <!-- Accent line -->
    <line x1="18" y1="25" x2="69" y2="25" stroke="#e22718" stroke-width="1.5"/>
    <!-- H letter -->
    <text x="44" y="33" font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">H</text>
  </g>

  <!-- Badge text -->
  <g transform="translate(8, 18)">
    <text x="93" y="52" font-family="Inter, -apple-system, sans-serif" font-size="22" font-weight="700" letter-spacing="5" fill="#ffffff" text-transform="uppercase">AGENT</text>
    <text x="93" y="80" font-family="Inter, -apple-system, sans-serif" font-size="28" font-weight="300" letter-spacing="3" fill="#bbbbbb" text-transform="uppercase">HOOK</text>
    <!-- Small M stripe underline -->
    <rect x="93" y="92" width="50" height="2" fill="url(#mStripe)" rx="0"/>
  </g>
</svg>